# Hush Pulse: the monitor of the monitors. Added by /hush-setup.
#
# Runs on GitHub Actions, apart from the routines it watches: what stops them must not stop this.
# It asks Hush which monitors need a look (dead, said ok after reading nothing, degraded, missed
# their run), opens one issue per problem, closes the issue when the monitor recovers, and files
# an issue of its own when Hush does not answer. No model, no tokens.
name: hush-pulse
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HUSH_URL: ${{ vars.HUSH_URL || '__ORIGIN__' }}
      HUSH_KEY: ${{ secrets.HUSH_KEY }}
    steps:
      - name: Ask Hush
        id: ask
        run: |
          gh label create hush:pulse --color E8913A --description "Filed by Hush Pulse" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          if [ -z "$HUSH_KEY" ]; then echo "::error::the HUSH_KEY repo secret is missing"; exit 1; fi
          if ! curl -sf -m 30 -H "authorization: Bearer $HUSH_KEY" "$HUSH_URL/api/report" -o day.json; then
            title="[hush-pulse] Hush did not answer"
            if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label hush:pulse --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
              gh issue create -R "$GITHUB_REPOSITORY" --label hush:pulse --title "$title" \
                --body "Pulse could not read $HUSH_URL/api/report. Until it answers, nothing tells a dead monitor from a quiet one."
            fi
            exit 1
          fi
      - name: One issue per monitor that needs a look
        run: |
          say() { case "$1" in dead) echo "stopped" ;; late) echo "missed its last run" ;; degraded) echo "is chronically degraded" ;; lying) echo "said ok after reading nothing" ;; warn) echo "came back degraded" ;; *) echo "needs a look" ;; esac; }
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label hush:pulse --limit 200 --json number,title)
          seen=""
          while read -r skill state; do
            [ -n "$skill" ] || continue
            title="[hush-pulse] $skill $(say "$state")"
            seen="$seen|$skill|"
            if [ -z "$(echo "$open" | jq -r --arg t "$title" '.[] | select(.title == $t) | .number')" ]; then
              gh issue create -R "$GITHUB_REPOSITORY" --label hush:pulse --title "$title" \
                --body "Hush judged **$skill** as \`$state\`. See $(jq -r .url day.json)."
            fi
          done < <(jq -r '.needs[] | "\(.skill) \(.state)"' day.json)
          # a monitor that recovered closes its issue
          echo "$open" | jq -r '.[] | "\(.number)\t\(.title)"' | while IFS=$'\t' read -r n t; do
            s=$(echo "$t" | sed -n 's/^\[hush-pulse\] \([^ ]*\) .*/\1/p')
            [ -n "$s" ] && [ "$t" != "[hush-pulse] Hush did not answer" ] || continue
            case "$seen" in *"|$s|"*) ;; *) gh issue close -R "$GITHUB_REPOSITORY" "$n" --comment "Hush judges $s healthy again." ;; esac
          done
          # Hush answered, so an open "did not answer" issue is over
          for n in $(echo "$open" | jq -r '.[] | select(.title == "[hush-pulse] Hush did not answer") | .number'); do
            gh issue close -R "$GITHUB_REPOSITORY" "$n" --comment "Hush answers again."
          done
      - name: Heartbeat
        if: always()
        run: |
          status=$([ "${{ job.status }}" = "success" ] && echo ok || echo degraded)
          n=$(jq '.needs | length' day.json 2>/dev/null || echo 0)
          curl -s -m 10 -X POST "$HUSH_URL/api/heartbeat" -H "authorization: Bearer $HUSH_KEY" -H "content-type: application/json" \
            -d "{\"monitor\":\"hush-pulse\",\"status\":\"$status\",\"source\":\"actions\",\"swept\":{\"needs\":$n}}" || true
